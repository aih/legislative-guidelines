name: Build and deploy site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  # Overridden by the SITE_URL repository variable when set.
  SITE_URL: ${{ vars.SITE_URL || 'https://legdraft.linkedlegislation.org/' }}
  FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Validate catalog schema
        run: python scripts/validate_catalog.py
      - name: Run unit tests
        run: pytest -v
      - name: Convert any newly fetched documents to HTML
        run: python scripts/convert.py
      - name: Build site
        run: python scripts/build_site.py
      - name: Build search index
        run: npx -y pagefind@1.3.0 --site dist
      - name: Export OpenSearch bulk file
        run: python scripts/export_opensearch.py
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
