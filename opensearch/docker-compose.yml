# Local OpenSearch + Dashboards for the guidelines index.
#   docker compose -f opensearch/docker-compose.yml up -d
#   python scripts/export_opensearch.py --load http://localhost:9200
# Security is disabled: for local use only.
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
  dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
volumes:
  opensearch-data:
