# ---------------------------------------------------------------- United Kingdom
- id: uk-opc-drafting-guidance
  title: "Office of the Parliamentary Counsel: Drafting guidance"
  jurisdiction: United Kingdom
  jurisdiction_level: national
  country_code: GB
  region: Europe
  issuing_body: Office of the Parliamentary Counsel (Cabinet Office)
  languages: [en]
  document_type: drafting guidance
  legal_status: Guidance
  edition: 19 March 2024
  published: "2010-10-02"
  last_updated: "2024-04-04"
  currency:
    status: current
    note: March 2024 revision (gender-neutral drafting, citation, uncommenced material, made affirmative procedure). Also published as HTML on GOV.UK.
    checked_on: "2026-10-29"
  original_format: PDF
  source_url: https://assets.publishing.service.gov.uk/media/660407d091a320001a82b06b/2024.03.19.Drafting-guidance.pdf
  landing_url: https://www.gov.uk/government/publications/drafting-bills-for-parliament
  license: Open Government Licence v3.0
  topics: [plain_language, gender_neutrality, modal_verbs, paragraphing, definitions]
  key_principles:
    - "§ 2.1 Gender neutrality: Draft gender-neutrally by repeating the noun, restructuring, or using 'they/their'; avoid 'he or she'."
    - "§ 3.1 Plain language & active voice: Write short sentences in the active voice and identify the legal actor clearly."
    - "§ 3.2 Avoid 'shall': Use 'must' for obligations and present tense ('is', 'applies') for legal states or declarations."
    - "§ 3.4 Paragraphing: Split multiple conditions or elements into tabulated sub-paragraphs (a), (b), (c) with a single 'and' or 'or'."
    - "§ 4.4 Definitions: Place definitions where most helpful to the reader and never embed substantive rules inside a definition."

