# One entry per document. Field reference: data/SCHEMA.md
# `retrieval` blocks are written by scripts/fetch.py; do not edit them by hand.
#
# currency.status values:
#   current     - latest edition located; no newer edition found on the issuer's site
#   in-force    - binding instrument currently in force (e.g. a regulation or circular)
#   dated       - still the issuer's reference text but not revised for many years
#   superseded  - replaced by a newer document (see currency.superseded_by)
#   unverified  - not yet checked against the issuer's site

