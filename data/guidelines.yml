# Catalog of legislative drafting guidelines.
#
# One entry per document. Field reference: data/SCHEMA.md
# `retrieval` blocks are written by scripts/fetch.py; do not edit them by hand.
#
# currency.status values:
#   current     - latest edition located; no newer edition found on the issuer's site
#   in-force    - binding instrument currently in force (e.g. a regulation or circular)
#   dated       - still the issuer's reference text but not revised for many years
#   superseded  - replaced by a newer document (see currency.superseded_by)
#   unverified  - not yet checked against the issuer's site

- id: eu-joint-practical-guide
  title: Joint Practical Guide of the European Parliament, the Council and the Commission for persons involved in the drafting of European Union legislation
  jurisdiction: European Union
  jurisdiction_level: supranational
  country_code: EU
  region: Europe
  issuing_body: European Parliament, Council of the European Union, European Commission
  languages: [en]
  document_type: drafting guide
  legal_status: Interinstitutional guidance (implements the 1998 Interinstitutional Agreement on the quality of drafting)
  edition: 2nd edition
  published: "2015"
  last_updated: "2015"
  currency:
    status: current
    note: Second edition (2015) remains the published edition; available in all EU official languages.
    checked_on: "2026-10-29"
  original_format: PDF
  source_url: https://eur-lex.europa.eu/content/techleg/KB0213228ENN.pdf
  landing_url: https://op.europa.eu/en/publication-detail/-/publication/3879747d-7a3c-411b-a3a0-55c14e2ba732
  license: "© European Union; reuse authorised under Commission Decision 2011/833/EU"
  topics: [recitals, enacting_formula, multilingual_drafting, definitions, amending_acts]
  key_principles:
    - "Rule 1: Legislative acts must be drafted clearly, simply, and precisely to ensure equality before the law across all 24 official languages."
    - "Rule 2 & ISG § 2.3: English operative articles of binding acts use 'shall' to impose obligations; French and German use the indicative present."
    - "Rule 10: Recitals ('Whereas') must set out concise reasons for the chief provisions of the enacting terms and must NEVER contain normative rules or political appeals."
    - "Rule 14: Definitions must never contain autonomous normative provisions."
    - "Rule 16: Avoid cascading or imprecise cross-references; never modify an act substantively merely via a cross-reference."

